#cloud-config
# Vultr: paste this into "Cloud-Init User-Data" (Additional Features) when deploying an
# Ubuntu 24.04 or newer instance. It runs tools/deploy/setup.sh on first boot. Edit the
# settings below first; see docs/deploy-vultr.md. Nothing secret goes in here: the access
# token is made on the server and stays there.
write_files:
  - path: /etc/daydream/deploy.env
    permissions: "0644"
    content: |
      # Blank: the address as <a-b-c-d>.sslip.io, no DNS needed. Or your own name,
      # whose DNS A record points at this instance.
      DAYDREAM_DOMAIN=
      # The branch to build. It needs the access token (`daydream new-token`).
      DAYDREAM_REF=main
      # Where this setup script comes from (its branch until it is merged).
      DAYDREAM_SETUP_REF=main
runcmd:
  - - bash
    - -c
    - >-
      set -a; . /etc/daydream/deploy.env; set +a;
      curl -fsSL "https://raw.githubusercontent.com/jnfisher/daydream/${DAYDREAM_SETUP_REF:-main}/tools/deploy/setup.sh" -o /root/daydream-setup.sh &&
      bash /root/daydream-setup.sh > /var/log/daydream-setup.log 2>&1;
      echo "daydream setup exit $?" >> /var/log/daydream-setup.log
