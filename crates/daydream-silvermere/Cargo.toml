[package]
name = "daydream-silvermere"
description = "Reading and writing a realm's world straight in silvermere's own SQLite or PostgreSQL database."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# one test binary for all of tests/ (tests/all.rs), not one per file
autotests = false

[lints]
workspace = true

[dependencies]
daydream-store.workspace = true
daydream-types.workspace = true
daydream-wcc.workspace = true
jiff.workspace = true
miniz_oxide.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time", "sync"] }
tracing.workspace = true

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
