[workspace]
resolver = "3"
members = [
    "bin/daydream",
    "crates/daydream-nmr",
    "crates/daydream-server",
    "crates/daydream-store",
    "crates/daydream-types",
    "crates/daydream-wcc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false
license = "MIT"
repository = "https://github.com/jnfisher/Daydream"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
daydream-nmr = { path = "crates/daydream-nmr" }
daydream-server = { path = "crates/daydream-server" }
daydream-store = { path = "crates/daydream-store" }
daydream-types = { path = "crates/daydream-types" }
daydream-wcc = { path = "crates/daydream-wcc" }
anyhow = "1.0.104"
axum = "0.8.9"
bitflags = { version = "2.13.2", features = ["serde"] }
# young (0.2): pinned exactly; used only to read .mdb files
datacraft-jet = "=0.2.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = "0.2.38"
miniz_oxide = "0.9.1"
proptest = "1.12.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Light optimisation in tests: decoding and converting the stock world is slow unoptimised.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
