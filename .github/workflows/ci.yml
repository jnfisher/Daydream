name: CI

# Two jobs. `web` type-checks the UI, checks the bundle the server embeds is the one its
# sources build, and holds it to its size budget (a minute, no Rust). `rust` runs fmt, clippy, then every test. It stays fast
# by doing no work twice:
# - Swatinem/rust-cache keeps the dependency builds between runs.
# - The stock MajorMUD 1.11p package is downloaded once and kept by actions/cache, keyed by
#   its pinned sha256 (crates/daydream-wcc/src/stock.rs), so it is fetched again only when
#   the pin changes.
# - wbtrv32's converter (the oracle for the store's differential tests) is built once and
#   kept, keyed by the commit pinned in tools/wbtrv32/build-oracle.sh.
# - silvermere's release binary (for the adapter's serve test) is downloaded once and kept,
#   keyed by the version pinned below; PostgreSQL is a service container.
# - Changes to prose only (docs, README, LICENSE) do not run it.
# The differential run against real NMR and Btrieve is the Windows workflow (jet.yml).
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # incremental builds only help a local tree; in CI they bloat the cache
  CARGO_INCREMENTAL: 0
  # the silvermere release the tests serve with (its schema is the one copied into
  # crates/daydream-silvermere/migrations; 1.0.3 has the admin API publishing drives)
  SILVERMERE_VERSION: 1.0.3

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: type check
        run: npm run check
      - name: the committed bundle is current
        run: |
          npm run build
          if [ -n "$(git status --porcelain -- ../crates/daydream-server/src)" ]; then
            git status --short -- ../crates/daydream-server/src
            echo "::error::the bundle in crates/daydream-server/src (app.js, app.css, fonts, notices.txt) is stale: run npm run build in web/ and commit it"
            exit 1
          fi
      - name: within the size budget
        run: npm run budget

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: daydream_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DAYDREAM_POSTGRES_URL: postgres://postgres:pg@localhost:5432/daydream_test
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Cache keys (stock package sha256, wbtrv32 commit)
        id: keys
        run: |
          echo "stock=$(sed -n 's/^pub const SHA256: &str = "\(.*\)";/\1/p' crates/daydream-wcc/src/stock.rs)" >> "$GITHUB_OUTPUT"
          echo "wbtrv32=$(sed -n 's/^COMMIT=//p' tools/wbtrv32/build-oracle.sh)" >> "$GITHUB_OUTPUT"

      - name: Stock data cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/daydream/stock/WCCMMUD_1.11p_DOS_MBBSEmu_v2.zip
          key: stock-${{ steps.keys.outputs.stock }}

      - name: wbtrv32 oracle cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/daydream/wbtrv32
          key: wbtrv32-${{ runner.os }}-${{ steps.keys.outputs.wbtrv32 }}

      - name: wbtrv32 oracle (built when not cached)
        run: tools/wbtrv32/build-oracle.sh >> "$GITHUB_ENV"

      - name: MME reference cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/daydream/mme
          key: mme-${{ hashFiles('tools/mme/reference.sh') }}

      - name: MME reference (NMR's own MME export of the stock world)
        run: tools/mme/reference.sh >> "$GITHUB_ENV"

      - name: silvermere cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/daydream/silvermere
          key: silvermere-${{ runner.os }}-${{ env.SILVERMERE_VERSION }}

      - name: silvermere (downloaded when not cached)
        run: |
          set -euo pipefail
          dir="$HOME/.cache/daydream/silvermere"
          name="silvermere-$SILVERMERE_VERSION-x86_64-unknown-linux-musl"
          if [ ! -x "$dir/$name/silvermere" ]; then
            mkdir -p "$dir"
            curl -sSfL --retry 3 "https://github.com/jnfisher/silvermere/releases/download/v$SILVERMERE_VERSION/$name.tar.gz" | tar -C "$dir" -xz
          fi
          echo "SILVERMERE_BIN=$dir/$name/silvermere" >> "$GITHUB_ENV"

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        if: ${{ !cancelled() }}
        # every failure in one run, not the first crate's
        run: cargo test --workspace --locked --no-fail-fast
